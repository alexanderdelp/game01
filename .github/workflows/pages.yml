name: Test & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      # Prototyp Vorgeschichte (Branch, nicht auf main) zusätzlich unter /vorgeschichte/; ein Fehler dort hält das Spiel nicht auf
      - id: proto
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: prototyp/vorgeschichte
          path: proto
      - id: proto-build
        if: steps.proto.outcome == 'success'
        continue-on-error: true
        working-directory: proto
        run: npm ci && npm test && npm run build
      - if: steps.proto-build.outcome == 'success'
        run: cp -r proto/dist dist/vorgeschichte
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
